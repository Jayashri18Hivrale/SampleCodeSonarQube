name: C Project CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify GCC
        shell: bash
        run: gcc --version
      
      - name: Build C Project
        shell: bash
        run: |
          # Compile your C code (adjust as needed)
          gcc -o myapp *.c

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-scan-action@v5
        with:
          organization: JAYASHRI KAILAS HIVRALE
          projectKey: jayashri18hivrale
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_CLOUD_TOKEN }}
        
